<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Slide 12</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1280px; height: 720px; overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111827;
        }
        .slide-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            column-gap: 20px;
            padding: 60px 80px;
            height: 100%;
        }
        .header {
            grid-column: 1 / 13;
            margin-bottom: 30px;
            border-bottom: 2px solid #0047AB;
            padding-bottom: 20px;
        }
        h2 {
            font-size: 54px;
            font-weight: 700;
            color: #0047AB;
        }
        .matrix-container {
            grid-column: 1 / 13;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            /* Header + 4 Rows */
            grid-template-rows: auto auto auto auto auto; 
        }
        .cell {
            padding: 20px;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            font-size: 20px;
        }
        .header-cell {
            font-weight: 700;
            color: #0047AB;
            border-bottom: 2px solid #0047AB;
        }
        .row-label {
            font-weight: 500;
            color: #111827;
        }
        .our-col {
            background-color: rgba(0, 194, 203, 0.05); /* Tech Teal tint */
            font-weight: bold;
            justify-content: center;
        }
        .our-header {
            background-color: rgba(0, 194, 203, 0.1);
            border-top: 4px solid #0047AB;
            color: #0047AB;
            justify-content: center;
        }
        .competitor-col {
            color: #6B7280;
            justify-content: center;
        }
        .check {
            color: #00C2CB;
            font-weight: bold;
            font-size: 28px;
        }
        .cross {
            color: #D1D5DB;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Fragmented Market Ready for Consolidation</h2>
        </div>
        <div class="matrix-container">
            <!-- Headers -->
            <div class="cell header-cell">Feature / Capability</div>
            <div class="cell header-cell our-header">Rehab-E-Cam</div>
            <div class="cell header-cell competitor-col" style="justify-content: center;">zInspector</div>
            <div class="cell header-cell competitor-col" style="justify-content: center;">BiggerPockets</div>
            <div class="cell header-cell competitor-col" style="justify-content: center;">STACK</div>

            <!-- Row 1 -->
            <div class="cell row-label">AR Cost Overlays</div>
            <div class="cell our-col"><span class="check">✓</span></div>
            <div class="cell competitor-col"><span class="cross">—</span></div>
            <div class="cell competitor-col"><span class="cross">—</span></div>
            <div class="cell competitor-col"><span class="cross">—</span></div>

            <!-- Row 2 -->
            <div class="cell row-label">Investor Deal Analysis</div>
            <div class="cell our-col"><span class="check">✓</span></div>
            <div class="cell competitor-col"><span class="cross">—</span></div>
            <div class="cell competitor-col"><span class="check">✓</span></div>
            <div class="cell competitor-col"><span class="cross">—</span></div>

            <!-- Row 3 -->
            <div class="cell row-label">Automated Scope Gen</div>
            <div class="cell our-col"><span class="check">✓</span></div>
            <div class="cell competitor-col"><span class="check">✓</span></div>
            <div class="cell competitor-col"><span class="cross">—</span></div>
            <div class="cell competitor-col"><span class="check">✓</span></div>

            <!-- Row 4 -->
            <div class="cell row-label">Mobile-First Integrated Workflow</div>
            <div class="cell our-col"><span class="check">✓</span></div>
            <div class="cell competitor-col"><span class="cross">Partial</span></div>
            <div class="cell competitor-col"><span class="cross">—</span></div>
            <div class="cell competitor-col"><span class="cross">Desktop</span></div>
        </div>
    </div>
</body>
</html>
