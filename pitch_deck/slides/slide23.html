<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Slide 23</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1280px; height: 720px; overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111827;
        }
        .slide-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            column-gap: 20px;
            padding: 60px 80px;
            height: 100%;
        }
        .header {
            grid-column: 1 / 13;
            margin-bottom: 30px;
            border-bottom: 2px solid #0047AB;
            padding-bottom: 20px;
        }
        h2 {
            font-size: 54px;
            font-weight: 700;
            color: #0047AB;
        }
        .flywheel-container {
            grid-column: 2 / 9; /* Shifted Left */
            position: relative;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            padding: 10px;
        }
        .hub {
            width: 150px;
            height: 150px;
            background: #0047AB;
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        .node {
            width: 120px;
            height: 120px;
            background: white;
            border: 3px solid #00C2CB;
            color: #374151;
            font-size: 14px;
        }
        /* Positioning nodes */
        .n1 { top: 0; }
        .n2 { right: 0; top: 50%; transform: translateY(-50%); }
        .n3 { bottom: 0; }
        .n4 { left: 0; top: 50%; transform: translateY(-50%); }
        
        .arrow-curved {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 4px dashed #D1D5DB;
            border-radius: 50%;
            z-index: 1;
        }
        
        .text-panel {
            grid-column: 10 / 13;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Data Gets Better With Every Use</h2>
        </div>
        <div class="flywheel-container">
            <div class="arrow-curved"></div>
            <div class="circle hub">Proprietary<br>Cost Database</div>
            
            <div class="circle node n1" style="transform: translate(0, -10px);">Users Scans<br>(Input Data)</div>
            <div class="circle node n2" style="transform: translate(40px, -50%);">Better<br>Accuracy</div>
            <div class="circle node n3" style="transform: translate(0, 10px);">Lender<br>Confidence</div>
            <div class="circle node n4" style="transform: translate(-40px, -50%);">More<br>Adoption</div>
        </div>
        <div class="text-panel">
            <p style="font-size: 24px; color: #374151; margin-bottom: 40px;">
                <span style="color: #00C2CB; font-size: 64px; font-weight: bold; display: block;">10k+</span>
                Items Price-Tracked
            </p>
            <p style="font-size: 24px; color: #374151;">
                <span style="color: #0047AB; font-size: 48px; font-weight: bold; display: block;">Real-Time</span>
                Zip Code Localization
            </p>
        </div>
    </div>
</body>
</html>
