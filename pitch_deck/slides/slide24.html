<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Slide 24</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1280px; height: 720px; overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111827;
        }
        .slide-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            column-gap: 20px;
            padding: 60px 80px;
            height: 100%;
        }
        .header {
            grid-column: 1 / 13;
            margin-bottom: 40px;
            border-bottom: 2px solid #0047AB;
            padding-bottom: 20px;
        }
        h2 {
            font-size: 54px;
            font-weight: 700;
            color: #0047AB;
        }
        .funnel-container {
            grid-column: 1 / 8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .funnel-layer {
            width: 100%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 5px;
            position: relative;
        }
        .l1 { height: 60px; background: #9CA3AF; width: 100%; clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%); }
        .l2 { height: 60px; background: #6B7280; width: 80%; clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%); }
        .l3 { height: 60px; background: #4D7BC7; width: 60%; clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%); }
        .l4 { height: 60px; background: #0047AB; width: 40%; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); border-bottom: 5px solid #00C2CB; }
        
        .metrics-right {
            grid-column: 9 / 13;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 40px;
        }
        .metric-box h3 {
            font-size: 48px;
            color: #0047AB;
            margin-bottom: 5px;
        }
        .metric-box p {
            font-size: 18px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Customer Acquisition Strategy</h2>
        </div>
        <div class="funnel-container">
            <div class="funnel-layer l1">Awareness: SEO & Content</div>
            <div class="funnel-layer l2">Lead Gen: Free Calculator</div>
            <div class="funnel-layer l3">Activation: Mobile Download</div>
            <div class="funnel-layer l4">Conversion: Paid Sub</div>
        </div>
        <div class="metrics-right">
            <div class="metric-box">
                <h3>$45</h3>
                <p>Target CAC (Blended)</p>
            </div>
            <div class="metric-box">
                <h3>$1,200</h3>
                <p>LTV (3 Year Horizon)</p>
            </div>
            <div class="metric-box">
                <h3>26:1</h3>
                <p>LTV:CAC Ratio</p>
            </div>
        </div>
    </div>
</body>
</html>
