<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Slide 18</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1280px; height: 720px; overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111827;
        }
        .slide-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            column-gap: 20px;
            padding: 60px 80px;
            height: 100%;
        }
        .header {
            grid-column: 1 / 13;
            margin-bottom: 30px;
            border-bottom: 2px solid #0047AB;
            padding-bottom: 20px;
        }
        h2 {
            font-size: 54px;
            font-weight: 700;
            color: #0047AB;
        }
        .demo-layout {
            grid-column: 1 / 13;
            display: grid;
            grid-template-columns: 8fr 4fr;
            gap: 40px;
            height: 480px;
        }
        .screenshot-container {
            background-color: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .screenshot-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .features-list {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
        }
        .feature-point {
            position: relative;
            padding-left: 20px;
        }
        .feature-point::before {
            content: "";
            position: absolute;
            left: 0;
            top: 8px;
            width: 8px;
            height: 8px;
            background-color: #00C2CB;
            border-radius: 50%;
        }
        .fp-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 5px;
        }
        .fp-desc {
            font-size: 16px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Automated Scope Generation</h2>
        </div>
        <div class="demo-layout">
            <div class="screenshot-container">
                <img src="images/sow.png" alt="Scope of Work">
            </div>
            <div class="features-list">
                <div class="feature-point">
                    <div class="fp-title">Line-Item Detail</div>
                    <div class="fp-desc">Generates professional line-items from visual data.</div>
                </div>
                <div class="feature-point">
                    <div class="fp-title">Photo Mapping</div>
                    <div class="fp-desc">Every line item links to the specific photo of the issue.</div>
                </div>
                <div class="feature-point">
                    <div class="fp-title">Export Ready</div>
                    <div class="fp-desc">One click to PDF, CSV, or integration with project management tools.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
