<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Slide 28</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1280px; height: 720px; overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111827;
        }
        .slide-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            column-gap: 20px;
            padding: 60px 80px;
            height: 100%;
        }
        .header {
            grid-column: 1 / 13;
            margin-bottom: 40px;
            border-bottom: 2px solid #0047AB;
            padding-bottom: 20px;
        }
        h2 {
            font-size: 54px;
            font-weight: 700;
            color: #0047AB;
        }
        .profit-chart {
            grid-column: 1 / 9;
            position: relative;
            height: 400px;
            border-left: 2px solid #E5E7EB;
            border-bottom: 2px solid #E5E7EB;
        }
        /* Simple Line Chart with CSS */
        .line-segment {
            position: absolute;
            background-color: #0047AB;
            height: 4px;
            transform-origin: left center;
        }
        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: white;
            border: 3px solid #00C2CB;
            border-radius: 50%;
            z-index: 2;
        }
        .label-x {
            position: absolute;
            bottom: -30px;
            font-weight: bold;
            color: #6B7280;
        }
        .breakeven-line {
            position: absolute;
            width: 100%;
            border-top: 2px dashed #9CA3AF;
            top: 50%;
        }
        .breakeven-label {
            position: absolute;
            right: 0;
            top: -25px;
            color: #9CA3AF;
            font-weight: bold;
        }
        
        .highlights {
            grid-column: 10 / 13;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
        }
        .hl-item h4 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 5px;
        }
        .hl-item p {
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Path to Profitability</h2>
        </div>
        <div class="profit-chart">
            <div class="breakeven-line"><span class="breakeven-label">Break-even</span></div>
            
            <!-- Simplified visualization of curve -->
            <!-- Year 1: Loss -->
            <div class="dot" style="left: 10%; top: 80%;"></div>
            <div class="label-x" style="left: 10%;">Year 1</div>
            
            <!-- Year 2: Less Loss -->
            <div class="dot" style="left: 35%; top: 60%;"></div>
            <div class="label-x" style="left: 35%;">Year 2</div>
            
            <!-- Year 3: Break Even -->
            <div class="dot" style="left: 60%; top: 50%;"></div>
            <div class="label-x" style="left: 60%;">Year 3</div>
            
            <!-- Year 4: Profit -->
            <div class="dot" style="left: 85%; top: 20%;"></div>
            <div class="label-x" style="left: 85%;">Year 4</div>
            
            <!-- Connecting lines (approximate for CSS) -->
            <div class="line-segment" style="width: 25%; left: 10%; top: 80%; transform: rotate(-25deg);"></div>
            <div class="line-segment" style="width: 25%; left: 35%; top: 60%; transform: rotate(-15deg);"></div>
            <div class="line-segment" style="width: 25%; left: 60%; top: 50%; transform: rotate(-35deg);"></div>
        </div>
        <div class="highlights">
            <div class="hl-item">
                <h4>Unit Economics</h4>
                <p>LTV:CAC ratio enables sustainable scaling.</p>
            </div>
            <div class="hl-item">
                <h4>Month 28</h4>
                <p>Projected operational break-even point.</p>
            </div>
            <div class="hl-item">
                <h4>40% EBITDA</h4>
                <p>Target margin at scale (Year 5).</p>
            </div>
        </div>
    </div>
</body>
</html>
