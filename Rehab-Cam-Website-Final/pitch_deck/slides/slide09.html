<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Slide 9</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1280px; height: 720px; overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111827;
        }
        .slide-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            column-gap: 20px;
            padding: 60px 80px;
            height: 100%;
        }
        .header {
            grid-column: 1 / 13;
            margin-bottom: 30px;
            border-bottom: 2px solid #0047AB;
            padding-bottom: 20px;
        }
        h2 {
            font-size: 54px;
            font-weight: 700;
            color: #0047AB;
        }
        .chart-container {
            grid-column: 2 / 8;
            display: flex;
            align-items: flex-end;
            gap: 40px;
            height: 400px;
            padding-bottom: 40px;
            border-bottom: 2px solid #E5E7EB;
        }
        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
            height: 100%;
            justify-content: flex-end;
        }
        .bar {
            width: 100%;
            background-color: #0047AB;
            transition: height 0.5s;
        }
        .bar.future {
            background-color: #00C2CB;
        }
        .bar-label {
            margin-top: 15px;
            font-weight: bold;
            font-size: 20px;
        }
        .bar-value {
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 24px;
        }
        .info-panel {
            grid-column: 9 / 13;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
        }
        .info-item h4 {
            font-size: 24px;
            color: #0047AB;
            margin-bottom: 5px;
        }
        .info-item p {
            font-size: 18px;
            color: #4B5563;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Growing PropTech Market Opportunity</h2>
        </div>
        <div class="chart-container">
            <div class="bar-wrapper">
                <div class="bar-value">$8.5B</div>
                <div class="bar" style="height: 25%;"></div>
                <div class="bar-label">2025</div>
            </div>
            <div class="bar-wrapper">
                <div class="bar-value">$25B</div>
                <div class="bar future" style="height: 100%;"></div>
                <div class="bar-label">2034</div>
            </div>
        </div>
        <div class="info-panel">
            <div class="info-item">
                <h4>12-14% CAGR</h4>
                <p>Projected compound annual growth rate through 2034.</p>
            </div>
            <div class="info-item">
                <h4>35%+ Share</h4>
                <p>North America represents significant market opportunity.</p>
            </div>
            <div class="info-item">
                <h4>AR/VR Integration</h4>
                <p>Emerging technology segment with growth potential.</p>
            </div>
        </div>
    </div>
</body>
</html>
