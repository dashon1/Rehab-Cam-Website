<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Slide 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1280px; height: 720px; overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #0047AB; /* Royal Blue */
            color: #FFFFFF;
        }
        .slide-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            column-gap: 20px;
            padding: 60px 80px;
            height: 100%;
            position: relative;
        }
        .logo {
            position: absolute;
            top: 60px;
            right: 80px;
            height: 40px;
            filter: brightness(0) invert(1); /* White logo */
        }
        .content {
            grid-column: 2 / 12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        h1 {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 24px;
            color: #FFFFFF;
        }
        h3 {
            font-size: 36px;
            font-weight: 400;
            color: #00C2CB; /* Tech Teal */
            margin-bottom: 48px;
        }
        .accent-line {
            width: 200px; /* Span approx 2 cols */
            height: 4px;
            background-color: #00C2CB;
            margin-bottom: 48px;
        }
        .metadata {
            position: absolute;
            bottom: 60px;
            left: 80px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <img src="images/logo.png" alt="Logo" class="logo">
        <div class="content">
            <div class="accent-line"></div>
            <h1>Rehab-E-Cam:<br>Stop Guessing.<br>Start Flipping. Faster.</h1>
            <h3>The All-in-One Platform Transforming Real Estate Investment</h3>
        </div>
        <div class="metadata">
            Series A Investor Presentation • 2025
        </div>
    </div>
</body>
</html>
