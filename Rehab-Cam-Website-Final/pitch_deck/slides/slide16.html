<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Slide 16</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1280px; height: 720px; overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111827;
        }
        .slide-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            column-gap: 20px;
            padding: 60px 80px;
            height: 100%;
        }
        .header {
            grid-column: 1 / 13;
            margin-bottom: 30px;
            border-bottom: 2px solid #0047AB;
            padding-bottom: 20px;
        }
        h2 {
            font-size: 54px;
            font-weight: 700;
            color: #0047AB;
        }
        .demo-layout {
            grid-column: 1 / 13;
            display: grid;
            grid-template-columns: 8fr 4fr;
            gap: 40px;
            height: 480px;
        }
        .screenshot-container {
            background-color: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }
        .screenshot-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* Simulate AR Scan lines */
        .scan-line {
            position: absolute;
            top: 30%;
            left: 10%;
            width: 80%;
            height: 2px;
            background: #00C2CB;
            box-shadow: 0 0 10px #00C2CB;
            animation: scan 3s infinite;
        }
        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
        .features-list {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
        }
        .feature-point {
            position: relative;
            padding-left: 20px;
        }
        .feature-point::before {
            content: "";
            position: absolute;
            left: 0;
            top: 8px;
            width: 8px;
            height: 8px;
            background-color: #00C2CB;
            border-radius: 50%;
        }
        .fp-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 5px;
        }
        .fp-desc {
            font-size: 16px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Live X-Ray: AR-Powered Analysis</h2>
        </div>
        <div class="demo-layout">
            <div class="screenshot-container">
                <img src="images/xray.png" alt="X-Ray Scan">
                <div class="scan-line"></div>
            </div>
            <div class="features-list">
                <div class="feature-point">
                    <div class="fp-title">Room Recognition</div>
                    <div class="fp-desc">AI automatically identifies "Kitchen", "Master Bath", etc.</div>
                </div>
                <div class="feature-point">
                    <div class="fp-title">Material Database</div>
                    <div class="fp-desc">Access 10,000+ SKU prices localized to your zip code.</div>
                </div>
                <div class="feature-point">
                    <div class="fp-title">Photo Evidence</div>
                    <div class="fp-desc">High-res capture with stamped cost data for lenders.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
